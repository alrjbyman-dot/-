name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate game JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start + 8);
          if (start < 0 || end < 0) throw new Error('Game script not found');
          new Function(html.slice(start + 8, end));
          console.log('Game JavaScript syntax OK');
          NODE
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare Capacitor Android wrapper
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "empire-of-ash-kingdom",
            "version": "1.0.0",
            "private": true,
            "description": "Empire of Ash - mobile survival roguelite",
            "scripts": { "build": "mkdir -p www && cp index.html www/index.html" }
          }
          EOF
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.empireofash.kingdom",
            "appName": "Empire of Ash",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npm install --no-save sharp
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          (async () => {
            const svg = fs.readFileSync('icon.svg');
            const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
            for (const [density, size] of Object.entries(sizes)) {
              const dir = path.join('android/app/src/main/res', 'mipmap-' + density);
              fs.mkdirSync(dir, { recursive: true });
              await sharp(svg).resize(size, size).png().toFile(path.join(dir, 'ic_launcher.png'));
              await sharp(svg).resize(size, size).png().toFile(path.join(dir, 'ic_launcher_round.png'));
            }
            const adaptive = path.join('android/app/src/main/res/mipmap-anydpi-v26');
            for (const name of ['ic_launcher.xml', 'ic_launcher_round.xml']) {
              try { fs.unlinkSync(path.join(adaptive, name)); } catch (_) {}
            }
            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
            let manifest = fs.readFileSync(manifestPath, 'utf8');
            if (!manifest.includes('android:screenOrientation="landscape"')) {
              manifest = manifest.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="landscape"');
            }
            fs.writeFileSync(manifestPath, manifest);
            console.log('Custom launcher icons installed; Android orientation locked to landscape.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-of-ash-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Empire of Ash APK build ${{ github.run_number }}
          body: |
            Empire of Ash Android APK.
            Download the APK asset below and install it on your Android phone.
            This is an automatically built debug APK.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
