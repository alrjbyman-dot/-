<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c16;color:#eef5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;position:absolute;inset:0}#ui{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;gap:8px}.pill{background:#111b2bdc;border:1px solid #32445e;border-radius:13px;padding:8px 11px;box-shadow:0 5px 20px #0005;font-size:12px;color:#c6d7ef}.pill b{font-size:16px;color:white;display:block}.bar{height:7px;background:#26364c;border-radius:9px;overflow:hidden;margin-top:5px;width:120px}.fill{height:100%;background:linear-gradient(90deg,#38e8b4,#80ffb1);width:100%}#center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(ellipse at center,#101b2beF,#060912f5);padding:18px}.panel{width:min(620px,100%);max-height:94%;overflow:auto;border:1px solid #334760;border-radius:24px;padding:24px;background:linear-gradient(145deg,#18283a,#0c1321);box-shadow:0 25px 100px #0009}.logo{font-weight:1000;letter-spacing:2px;font-size:clamp(28px,7vw,48px);line-height:1;color:#f4f8ff;text-shadow:0 0 24px #5eead488}.logo span{color:#63f3c0}.sub{color:#9fb3ce;font-size:13px;line-height:1.5;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pick{border:1px solid #344861;background:#101a2a;border-radius:14px;padding:10px 8px;text-align:left;color:#e8f2ff;min-height:85px}.pick.sel{border-color:#58f0bd;background:#15332f;box-shadow:inset 0 0 0 1px #58f0bd}.pick strong{display:block;font-size:12px;margin:4px 0}.pick small{display:block;color:#9eb2cb;font-size:10px;line-height:1.3}.emoji{font-size:23px}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(100deg,#4be4b5,#b1ff9d);color:#07141b;font-size:15px;font-weight:900;margin-top:16px}.secondary{background:#233349;color:#e7f1ff;margin-top:8px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stats span{font-size:11px;color:#b7c8df;background:#111d2d;padding:7px 9px;border-radius:9px}.hide{display:none!important}#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#172a3a;border:1px solid #4be4b5;border-radius:12px;padding:10px 15px;font-size:13px;opacity:0;transition:opacity .2s}#joystick{position:absolute;left:22px;bottom:26px;width:124px;height:124px;border-radius:50%;background:#17243a88;border:1px solid #7b94b855;pointer-events:auto;display:none}#stick{position:absolute;left:38px;top:38px;width:46px;height:46px;border-radius:50%;background:#65f3c5bb;border:2px solid #d9fff2}#dash{position:absolute;right:22px;bottom:36px;width:76px;height:76px;border-radius:50%;border:2px solid #82f4d9;background:#143a38b8;color:white;font-weight:900;pointer-events:auto;display:none}#pause{pointer-events:auto;border:0;border-radius:9px;background:#17243bcc;color:white;padding:8px 10px;font-size:12px}

</style></head><body><canvas id="game"></canvas><div id="ui"><div class="top"><div class="pill">WAVE <b id="wave">1 / 20</b><div class="bar"><div class="fill" id="hpbar"></div></div><small id="hptext">100 / 100 HP</small></div><div class="pill">ELIMINATIONS <b id="kills">0</b></div><div class="pill">SCRAP <b id="scrap">0</b><small id="timer">00:45</small></div><button id="pause">Ⅱ</button></div><div id="toast"></div><div id="joystick"><div id="stick"></div></div><button id="dash">DASH</button><div id="center"><div class="panel" id="menu"></div></div></div>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=0,H=0,D=1;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const chars=[
{id:'vanguard',name:'VANGUARD',emoji:'🛡️',desc:'Balanced frontline fighter',hp:120,spd:205,dmg:1,rate:1,skill:'Every 12s: protective pulse'},
{id:'phantom',name:'PHANTOM',emoji:'👻',desc:'Fast, fragile, critical strikes',hp:78,spd:265,dmg:1.25,rate:.88,skill:'+25% critical chance'},
{id:'engineer',name:'ENGINEER',emoji:'🤖',desc:'Deploys orbiting sentry drones',hp:100,spd:190,dmg:.85,rate:1.2,skill:'Starts with 2 drones'},
{id:'pyro',name:'PYRO',emoji:'🔥',desc:'Burns enemies in a wide radius',hp:95,spd:200,dmg:1.05,rate:1.1,skill:'Bullets leave burning trails'},
{id:'medic',name:'MEDIC',emoji:'💚',desc:'Regenerates and heals on kills',hp:105,spd:205,dmg:.9,rate:1,skill:'Restore 2 HP per kill'},
{id:'berserker',name:'BERSERKER',emoji:'⚔️',desc:'Low health, devastating damage',hp:88,spd:220,dmg:1.65,rate:.95,skill:'Damage rises as HP falls'},

const weapons=[
{id:'pulse',name:'PULSE RIFLE',emoji:'🔫',desc:'Balanced fast projectile',cost:0,dmg:15,rate:.48,speed:590,color:'#72f7d0'},
{id:'shotgun',name:'SCATTERGUN',emoji:'💥',desc:'Five close-range pellets',cost:90,dmg:10,rate:1.0,speed:430,color:'#ffd166'},
{id:'rail',name:'RAIL LANCE',emoji:'⚡',desc:'Piercing high damage shot',cost:140,dmg:38,rate:1.25,speed:820,color:'#8db8ff'},
{id:'flame',name:'HELLFIRE',emoji:'🔥',desc:'Rapid burning projectiles',cost:130,dmg:8,rate:.22,speed:370,color:'#ff865c'},
{id:'orb',name:'VOID ORB',emoji:'🌀',desc:'Heavy explosive orb',cost:180,dmg:48,rate:1.6,speed:340,color:'#d69aff'},
{id:'blade',name:'PHASE BLADE',emoji:'🗡️',desc:'Orbiting blade hits nearby foes',cost:120,dmg:25,rate:.55,speed:0,color:'#e2f2ff'}

const items=[
{name:'Nanite Core',emoji:'🧬',desc:'+20 max HP and heal 20',price:65,apply:p=>{p.maxHp+=20;p.hp=Math.min(p.maxHp,p.hp+20)}},
{name:'Overclock Chip',emoji:'⚙️',desc:'Attack 15% faster',price:85,apply:p=>p.rate*=.85},
{name:'Flux Capacitor',emoji:'🔋',desc:'+18% movement speed',price:70,apply:p=>p.spd*=1.18},
{name:'Tungsten Rounds',emoji:'🎯',desc:'+25% weapon damage',price:100,apply:p=>p.dmg*=1.25},
{name:'Magnet Field',emoji:'🧲',desc:'Collect scrap from farther away',price:75,apply:p=>p.magnet+=95},
{name:'Reactive Armor',emoji:'🛡️',desc:'Take 18% less damage',price:95,apply:p=>p.armor=Math.min(.6,p.armor+.18)},
{name:'Lucky Charm',emoji:'🍀',desc:'+20% chance for bonus scrap',price:80,apply:p=>p.luck+=.2},
{name:'Medkit',emoji:'➕',desc:'Restore 45 health',price:55,apply:p=>p.hp=Math.min(p.maxHp,p.hp+45)},
{name:'Adrenaline',emoji:'💉',desc:'+12% damage and speed',price:110,apply:p=>{p.dmg*=1.12;p.spd*=1.12}},
{name:'Quantum Lens',emoji:'🔮',desc:'+20% critical damage',price:90,apply:p=>p.critDmg*=1.2},
{name:'Drone Bay',emoji:'🛰️',desc:'Add an orbiting attack drone',price:145,apply:p=>p.drones++},
{name:'Salvage Protocol',emoji:'💎',desc:'Earn 30 scrap instantly',price:50,apply:p=>p.scrap+=30}
];
let state='menu',selected=0,player=null,enemies=[],bullets=[],enemyBullets=[],gems=[],particles=[],floaters=[],drones=[],keys={},pointer={x:0,y:0,down:false},joy={x:0,y:0,active:false},last=0,spawn=0,shot=0,waveTime=45,wave=1,kills=0,elapsed=0,shake=0,shopItems=[],best=+(localStorage.getItem('voidBest')||0),sound=true;
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function playerInit(){let c=chars[selected];player={x:W/2,y:H/2,r:15,hp:c.hp,maxHp:c.hp,spd:c.spd,dmg:c.dmg,rate:c.rate,armor:0,magnet:100,luck:0,critDmg:1.7,weapon:'pulse',level:1,xp:0,nextXp:40,scrap:0,drones:c.id==='engineer'?2:0,invuln:0,dash:0,fire:0,mods:[],character:c};enemies=[];bullets=[];enemyBullets=[];gems=[];particles=[];floaters=[];wave=1;kills=0;waveTime=45;spawn=0;shot=0;elapsed=0;drones=[];for(let i=0;i<player.drones;i++)drones.push({a:i*6.28/Math.max(1,player.drones),r:42})}
function menuHome(){state='menu';document.querySelector('#center').classList.remove('hide');let m=document.querySelector('#menu');m.innerHTML='<div class="logo">VOID <span>RUNNER</span></div><div class="sub">LAST STAND · A neon survival roguelite<br>20 escalating waves. Endless builds. One final extraction.</div><div class="stats"><span>✦ 8 heroes</span><span>✦ 6 weapon classes</span><span>✦ 12 upgrades</span><span>✦ Elite bosses</span></div><h3>CHOOSE YOUR OPERATIVE</h3><div class="grid" id="chars"></div><button class="btn" id="start">DEPLOY TO THE VOID →</button><button class="btn secondary" id="how">HOW TO SURVIVE</button><div class="sub">BEST RUN: '+best+' eliminations · Auto-fire enabled · Progress saved on this device</div>';
let grid=m.querySelector('#chars');chars.forEach((c,i)=>{let b=document.createElement('button');b.className='pick '+(i===selected?'sel':'');b.innerHTML='<span class="emoji">'+c.emoji+'</span><strong>'+c.name+'</strong><small>'+c.desc+'</small>';b.onclick=()=>{selected=i;menuHome()};grid.appendChild(b)});m.querySelector('#start').onclick=startGame;m.querySelector('#how').onclick=()=>{m.innerHTML='<div class="logo">FIELD <span>MANUAL</span></div><div class="sub"><b>MOVE:</b> WASD / arrow keys, or left thumbstick on mobile.<br><b>COMBAT:</b> Your weapon auto-targets the closest enemy. Collect green XP shards and scrap dropped by enemies.<br><b>LEVEL UP:</b> Pick a stat boost when the bar fills. Every wave ends with a shop: buy weapons and relics.<br><b>DASH:</b> Tap the mobile DASH button or Space to burst forward and dodge hits.<br><b>BUILD:</b> Stack damage, fire rate, armor, drones and healing. Every hero plays differently.<br><br>Survive 20 waves. Watch for elite enemies every 5 waves. The void adapts to you.</div><button class="btn" onclick="void(0)" id="back">BACK</button>';m.querySelector('#back').onclick=menuHome}}
function startGame(){playerInit();state='play';document.querySelector('#center').classList.add('hide');document.querySelector('#joystick').style.display='block';document.querySelector('#dash').style.display='block';toast('SURVIVE THE VOID');last=performance.now()}
function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.tm);toast.tm=setTimeout(()=>el.style.opacity=0,1500)}
function panel(title,subtitle,cards,buttonText,callback){state='panel';let m=document.querySelector('#menu');document.querySelector('#center').classList.remove('hide');m.innerHTML='<div class="logo">'+title+'</div><div class="sub">'+subtitle+'</div><div class="stats"><span>❤️ '+Math.ceil(player.hp)+' / '+player.maxHp+'</span><span>⚙️ Scrap '+player.scrap+'</span><span>⚔️ '+player.weapon.toUpperCase()+'</span></div><div class="grid" id="options"></div><button class="btn" id="continue">'+buttonText+'</button>';let g=m.querySelector('#options');cards.forEach((c,i)=>{let b=document.createElement('button');b.className='pick';b.innerHTML='<span class="emoji">'+c.emoji+'</span><strong>'+c.name+'</strong><small>'+c.desc+'</small>'+(c.price!==undefined?'<small style="color:#7df4c5;margin-top:6px">$ '+c.price+'</small>':'');b.onclick=()=>{if(c.price!==undefined){if(player.scrap<c.price){toast('NOT ENOUGH SCRAP');return}player.scrap-=c.price;c.apply();b.classList.add('sel');b.disabled=true;b.style.opacity='.45';document.querySelector('#scrap').textContent=player.scrap;toast(c.name+' ACQUIRED')}else{c.apply();b.classList.add('sel');g.querySelectorAll('.pick').forEach(x=>{if(x!==b)x.disabled=true})}};g.appendChild(b)});m.querySelector('#continue').onclick=callback}
function levelUp(){let opts=[{emoji:'⚔️',name:'Damage Boost',desc:'+18% weapon damage',apply:()=>player.dmg*=1.18},{emoji:'💨',name:'Swift Foot',desc:'+12% movement speed',apply:()=>player.spd*=1.12},{emoji:'❤️',name:'Vitality',desc:'+20 max HP and heal 20',apply:()=>{player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+20)}},{emoji:'⏱️',name:'Rapid Fire',desc:'Attack 12% faster',apply:()=>player.rate*=.88},{emoji:'🛡️',name:'Armor Up',desc:'Reduce damage by 12%',apply:()=>player.armor=Math.min(.65,player.armor+.12)},{emoji:'🧲',name:'Magnetism',desc:'+70 pickup range',apply:()=>player.magnet+=70},{emoji:'🛰️',name:'Drone',desc:'Gain an orbiting drone',apply:()=>{player.drones++;drones.push({a:Math.random()*6.28,r:42})}},{emoji:'🍀',name:'Fortune',desc:'+12% bonus scrap chance',apply:()=>player.luck+=.12}];opts.sort(()=>Math.random()-.5);panel('LEVEL UP','Choose one permanent upgrade for this run.',opts.slice(0,6),'CONTINUE RUN →',()=>{state='play';document.querySelector('#center').classList.add('hide');last=performance.now()})}
function shop(){if(wave>20){victory();return}let pool=[...weapons.filter(w=>w.id!==player.weapon).map(w=>({emoji:w.emoji,name:w.name,desc:w.desc,price:w.cost,apply:()=>{player.weapon=w.id;player.dmg+=.08;toast('WEAPON EQUIPPED')}})),...items.map(i=>({...i,apply:()=>i.apply(player)}))];pool.sort(()=>Math.random()-.5);shopItems=pool.slice(0,6);panel('WAVE '+(wave-1)+' CLEARED','Spend scrap on weapons and relics. Prepare for the next wave.',shopItems,'NEXT WAVE →',()=>{wave++;waveTime=Math.max(22,48-wave*1.1);state='play';document.querySelector('#center').classList.add('hide');toast('WAVE '+wave+' INCOMING');last=performance.now()})}
function gameOver(win){state='over';document.querySelector('#joystick').style.display='none';document.querySelector('#dash').style.display='none';let score=kills;if(score>best){best=score;localStorage.setItem('voidBest',best)}document.querySelector('#center').classList.remove('hide');document.querySelector('#menu').innerHTML='<div class="logo">'+(win?'VOID <span>CONQUERED</span>':'RUN <span>ENDED</span>')+'</div><div class="sub">'+(win?'Extraction successful. You are a legend of the frontier.':'The swarm overwhelmed your operative. The void remembers.')+'</div><div class="stats"><span>☠ Eliminations: '+kills+'</span><span>🌊 Wave reached: '+wave+'</span><span>⏱ Survival: '+Math.floor(elapsed)+'s</span><span>✦ Best: '+best+'</span></div><button class="btn" id="again">DEPLOY AGAIN ↻</button><button class="btn secondary" id="home">CHANGE OPERATIVE</button>';document.querySelector('#again').onclick=startGame;document.querySelector('#home').onclick=menuHome}
function victory(){gameOver(true)}
function spawnEnemy(){let edge=Math.floor(Math.random()*4),x=edge===0?rand(0,W):edge===1?W+30:edge===2?rand(0,W):-30,y=edge===0?-30:edge===1?rand(0,H):edge===2?H+30:rand(0,H);let elite=wave%5===0&&Math.random()<.23;let type=Math.random();let e={x,y,r:elite?23:type<.2?17: type<.55?13:10,hp:(elite?180: type<.2?65:type<.55?30:18)*(1+wave*.19),maxHp:1,spd:(elite?52:type<.2?40:type<.55?65:88)*(1+wave*.025),dmg:elite?20: type<.2?16:9,elite,color:elite?'#ff5f8d':type<.2?'#f89b69':type<.55?'#a37aff':'#62c8ff',type:type<.2?'brute':type<.55?'stalker':'skitter',hit:0};e.maxHp=e.hp;enemies.push(e)}
function particle(x,y,color,n=7){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-150,150),vy:rand(-150,150),life:rand(.18,.5),max:.5,color,r:rand(1,3)})}
function damageEnemy(e,dmg){e.hp-=dmg;e.hit=.09;floaters.push({x:e.x,y:e.y-12,text:Math.round(dmg),life:.55,color:'#eafcff'});particle(e.x,e.y,e.color,3);if(e.hp<=0){kills++;particle(e.x,e.y,e.color,12);if(Math.random()<.9)gems.push({x:e.x,y:e.y,r:5,type:'xp',v:rand(5,10)});if(Math.random()<.52+player.luck)gems.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),r:5,type:'scrap',v:Math.random()<.15?5:2});if(player.character.id==='medic')player.hp=Math.min(player.maxHp,player.hp+2);enemies=enemies.filter(z=>z!==e)}}
function fire(){if(!enemies.length)return;let target=enemies.reduce((a,b)=>dist(a,player)<dist(b,player)?a:b);let dx=target.x-player.x,dy=target.y-player.y,l=Math.hypot(dx,dy)||1;let wid=player.weapon;let w=weapons.find(z=>z.id===wid)||weapons[0];if(wid==='blade')return;let count=wid==='shotgun'?5:1;for(let i=0;i<count;i++){let angle=Math.atan2(dy,dx)+(count>1?rand(-.28,.28):rand(-.035,.035));let crit=Math.random()<(player.character.id==='phantom'?.25:.08);bullets.push({x:player.x+Math.cos(angle)*16,y:player.y+Math.sin(angle)*16,vx:Math.cos(angle)*w.speed,vy:Math.sin(angle)*w.speed,r:wid==='orb'?7:wid==='rail'?4:3,dmg:w.dmg*player.dmg*(player.character.id==='berserker'?1+(1-player.hp/player.maxHp)*.9:1)*(crit?player.critDmg:1),life:wid==='rail'?1.4:wid==='orb'?2:1.05,color:w.color,pierce:wid==='rail'?3:0,hit:[]})}if(sound){} }
function dash(){if(player&&player.dash<=0){player.dash=.8;player.invuln=.35;let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+(joy.x),dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+(joy.y),l=Math.hypot(dx,dy)||1;player.x+=dx/l*85;player.y+=dy/l*85;particle(player.x,player.y,'#69f5d0',18)}}
function update(dt){if(state!=='play'||!player)return;elapsed+=dt;player.invuln=Math.max(0,player.invuln-dt);player.dash=Math.max(0,player.dash-dt);player.fire-=dt;waveTime-=dt;spawn-=dt;shake=Math.max(0,shake-dt*20);
let dx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+joy.x,dy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+joy.y;if(pointer.down&&joy.active===false&&innerWidth>=800){dx+=(pointer.x-W/2)/Math.max(W,H)*2;dy+=(pointer.y-H/2)/Math.max(W,H)*2}let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}let speed=player.spd*(player.invuln>.2?1.8:1);player.x=clamp(player.x+dx*speed*dt,player.r+5,W-player.r-5);player.y=clamp(player.y+dy*speed*dt,player.r+55,H-player.r-5);
if(spawn<=0){spawn=Math.max(.12,.72-wave*.023);let n=wave>=10?2:1;for(let i=0;i<n;i++)spawnEnemy()}
if(player.fire<=0){fire();let w=weapons.find(z=>z.id===player.weapon)||weapons[0];player.fire=w.rate*player.rate*player.character.rate}
for(let i=0;i<drones.length;i++){let d=drones[i];d.a+=dt*(1.5+i*.08);d.x=player.x+Math.cos(d.a)*d.r;d.y=player.y+Math.sin(d.a)*d.r;if(Math.random()<dt*2.3&&enemies.length){let e=enemies.reduce((a,b)=>dist(a,d)<dist(b,d)?a:b);let a=Math.atan2(e.y-d.y,e.x-d.x);bullets.push({x:d.x,y:d.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,r:3,dmg:9*player.dmg,life:.8,color:'#d69aff',pierce:0,hit:[]})}}
for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of [...enemies])if(!b.hit.includes(e)&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){damageEnemy(e,b.dmg);b.hit.push(e);if(b.pierce>0)b.pierce--;else b.life=0;if(player.weapon==='flame'){e.burn=1.2;e.burnDmg=3*player.dmg}break}}
bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50);
for(let e of enemies){let vx=player.x-e.x,vy=player.y-e.y,dd=Math.hypot(vx,vy)||1;e.x+=vx/dd*e.spd*dt;e.y+=vy/dd*e.spd*dt;if(e.burn){e.burn-=dt;e.hp-=e.burnDmg*dt}if(e.hit)e.hit-=dt;if(dd<e.r+player.r&&player.invuln<=0){player.hp-=e.dmg*(1-player.armor)*dt*1.6;player.invuln=.12;shake=2;particle(player.x,player.y,'#ff657d',5)}}
for(let g of gems){let d=Math.hypot(player.x-g.x,player.y-g.y);if(d<player.magnet){g.x+=(player.x-g.x)*Math.min(1,dt*(d<55?9:2.2));g.y+=(player.y-g.y)*Math.min(1,dt*(d<55?9:2.2))}if(d<player.r+g.r+4){if(g.type==='xp'){player.xp+=g.v;if(player.xp>=player.nextXp){player.xp-=player.nextXp;player.level++;player.nextXp=Math.round(player.nextXp*1.35);levelUp()}}else player.scrap+=g.v;g.got=true}}gems=gems.filter(g=>!g.got);

function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0c1423');bg.addColorStop(1,'#080b15');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let grid=42;ctx.strokeStyle='#23334a66';ctx.lineWidth=1;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<32;i++){let x=(i*173+47)%W,y=(i*239+21)%H;ctx.fillStyle='#9bc6ff22';ctx.fillRect(x,y,2,2)}
if(player){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));

for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.shadowBlur=e.elite?24:10;ctx.shadowColor=e.color;ctx.fillStyle=e.hit>0?'#fff':e.color;ctx.beginPath();let sides=e.elite?7:6;for(let i=0;i<sides;i++){let a=i*Math.PI*2/sides;ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#121a2a';ctx.beginPath();ctx.arc(-e.r*.28,-2,2.4,0,7);ctx.arc(e.r*.28,-2,2.4,0,7);ctx.fill();if(e.elite||e.hp<e.maxHp){ctx.fillStyle='#111827';ctx.fillRect(-e.r,-e.r-8,e.r*2,3);ctx.fillStyle=e.elite?'#ff4d80':'#74f5c7';ctx.fillRect(-e.r,-e.r-8,e.r*2*clamp(e.hp/e.maxHp,0,1),3)}ctx.restore()}
for(let b of bullets){ctx.save();ctx.shadowBlur=14;ctx.shadowColor=b.color;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.restore()}
for(let d of drones){ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#d69aff';ctx.fillStyle='#d69aff';ctx.beginPath();ctx.arc(d.x,d.y,6,0,7);ctx.fill();ctx.restore()}
for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
for(let f of floaters){ctx.globalAlpha=clamp(f.life*2,0,1);ctx.fillStyle=f.color;ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;
let c=player.character;ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=player.invuln>0?24:18;ctx.shadowColor=player.invuln>0?'#fff':'#55f0c1';ctx.fillStyle=c.id==='tank'?'#a7b7ca':c.id==='phantom'?'#b9a5ff':c.id==='pyro'?'#ff9b61':c.id==='medic'?'#7fffc1':c.id==='berserker'?'#ff6687':c.id==='ranger'?'#70c5ff':c.id==='engineer'?'#f0ce70':'#63f3c5';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#172538';ctx.beginPath();ctx.arc(5,-4,3,0,7);ctx.fill();ctx.fillStyle='#eafcff';ctx.beginPath();ctx.arc(6,-5,1,0,7);ctx.fill();ctx.strokeStyle='#d9fff4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,10);ctx.lineTo(-12,17);ctx.moveTo(8,10);ctx.lineTo(12,17);ctx.stroke();ctx.restore();
ctx.restore();ctx.fillStyle='#24354d';ctx.fillRect(W/2-70,H-12,140,3);ctx.fillStyle='#5beac0';ctx.fillRect(W/2-70,H-12,140*clamp(player.xp/player.nextXp,0,1),3)}
if(state==='menu'){ctx.fillStyle='#5cf3c0';ctx.globalAlpha=.07;for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(W*.5,H*.5,60+i*45+Math.sin(performance.now()/1000+i)*9,0,7);ctx.strokeStyle='#5cf3c0';ctx.stroke()}ctx.globalAlpha=1}}
function frame(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);

let joyEl=document.querySelector('#joystick'),stick=document.querySelector('#stick'),joyId=null;joyEl.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.active=true;joyEl.setPointerCapture(joyId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});function joyMove(e){let r=joyEl.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.hypot(x,y),m=38;if(l>m){x=x/l*m;y=y/l*m}joy.x=x/m;joy.y=y/m;stick.style.left=(38+x)+'px';stick.style.top=(38+y)+'px'}function joyEnd(){joyId=null;joy.active=false;joy.x=joy.y=0;stick.style.left='38px';stick.style.top='38px'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);document.querySelector('#dash').onclick=dash;document.querySelector('#pause').onclick=()=>{if(state==='play'){state='paused';panel('PAUSED','Your run is safe. Return when ready.',[{emoji:'▶️',name:'Resume',desc:'Continue the wave',apply:()=>{}}],'RESUME RUN →',()=>{state='play';document.querySelector('#center').classList.add('hide');last=performance.now()})}};menuHome();
