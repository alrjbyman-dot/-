<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#edf0df;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:manipulation}button{font:inherit;color:inherit;border:1px solid var(--line);background:linear-gradient(180deg,#294148,#1a2b31);border-radius:10px;padding:10px 12px;cursor:pointer}button:active{transform:translateY(1px);filter:brightness(1.2)}button:disabled{opacity:.38;cursor:default}.app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:#101a20}.top{z-index:5;padding:env(safe-area-inset-top) 10px 8px;background:linear-gradient(180deg,#1c2b30,#142126);border-bottom:1px solid #40545a;box-shadow:0 5px 16px #0005}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;letter-spacing:1.5px;font-size:14px;color:var(--gold)}.subtitle{font-size:10px;color:#a7bab4;letter-spacing:2px}.day{font-size:11px;color:#d8dfc9;text-align:right}.resources{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.res{background:#0d171b;border:1px solid #2e4146;border-radius:9px;padding:6px 4px;text-align:center;min-width:0}.res .ico{font-size:14px}.res b{display:block;font-size:13px;line-height:1.4}.res small{display:block;color:#a2b6b0;font-size:9px;letter-spacing:.5px}.main{position:relative;flex:1;min-height:0;overflow:hidden;background:#172a2a}canvas{display:block;width:100%;height:100%;touch-action:none}.mapfade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0b171922,transparent 22%,transparent 70%,#0b171955)}.maptop{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{background:#132126dc;border:1px solid #526b66;border-radius:9px;padding:7px 9px;font-size:11px;box-shadow:0 3px 10px #0003}.pill b{color:var(--gold)}.mapactions{display:flex;gap:5px;pointer-events:auto}.mapactions button{padding:7px 10px;background:#142328e8}.quest{position:absolute;left:9px;bottom:10px;max-width:66%;background:#132126e8;border:1px solid #53645b;border-radius:10px;padding:9px 11px;pointer-events:none;box-shadow:0 4px 14px #0004}.quest strong{font-size:11px;color:var(--gold);display:block;margin-bottom:2px}.quest span{font-size:10px;color:#d0d8c9;line-height:1.4}.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#0c171beF;border:1px solid var(--gold);color:#fff0c9;padding:9px 13px;border-radius:10px;font-size:12px;z-index:20;max-width:90%;text-align:center;display:none}.bottom{z-index:5;background:#142126;border-top:1px solid #40545a;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tab{padding:8px 2px;border-radius:9px;background:#1c2d32;border-color:#31484d;font-size:10px;color:#afc1ba}.tab span{display:block;font-size:18px;margin-bottom:1px}.tab.active{background:linear-gradient(180deg,#665339,#3c3328);border-color:#d1a95d;color:#fff0c6}.tray{display:flex;gap:7px;overflow-x:auto;min-height:70px;scrollbar-width:thin;padding-bottom:2px}.buildcard{flex:0 0 104px;text-align:left;padding:7px;background:#1d3035;border-color:#3b5255;border-radius:10px;position:relative}.buildcard .bi{font-size:20px}.buildcard b{display:block;font-size:11px;white-space:nowrap}.buildcard small{display:block;color:#adc0b5;font-size:9px;line-height:1.4}.buildcard .cost{color:#eac779}.buildcard.selected{border-color:#e8bd68;background:#3a382b}.info{font-size:11px;color:#b2c4bc;text-align:center;padding:2px}.modalwrap{position:absolute;inset:0;background:#061013bd;z-index:30;display:none;align-items:center;justify-content:center;padding:16px}.modal{width:min(560px,100%);max-height:86%;overflow:auto;background:linear-gradient(160deg,#22383d,#142328);border:1px solid #718176;border-radius:16px;padding:16px;box-shadow:0 20px 60px #0009}.modal h2{margin:0 0 6px;color:var(--gold);font-size:19px}.modal p{font-size:12px;color:#bfd0c6;line-height:1.55}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{padding:5px 10px}.modalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.tech{padding:11px;background:#1a2c31;border:1px solid #3b5558;border-radius:11px;text-align:left}.tech b{display:block;color:#f1dfb4;font-size:12px}.tech small{display:block;color:#a9beb4;font-size:10px;line-height:1.4;margin-top:4px}.tech em{display:block;font-size:10px;color:#e5bd6c;font-style:normal;margin-top:7px}.statline{display:flex;justify-content:space-between;border-bottom:1px solid #3b5051;padding:8px 0;font-size:12px}.statline span{color:#a8bcb3}.modalactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:linear-gradient(180deg,#9e7b43,#73532c);border-color:#d7b36a;color:#fff2cf;font-weight:800}.danger{border-color:#8b5148;color:#ffd5c8}.hidden{display:none!important}@media(min-width:760px){.top{padding-left:18px;padding-right:18px}.resources{gap:9px}.res{display:flex;align-items:center;justify-content:center;gap:8px}.res b{font-size:15px}.res small{font-size:10px}.bottom{padding-left:16px;padding-right:16px}.buildcard{flex-basis:130px;padding:10px}.buildcard b{font-size:12px}.quest{max-width:340px}.brand{font-size:16px}}

<body><div class="app">
<header class="top"><div class="brandrow"><div><div class="brand">EMPIRE OF ASH</div><div class="subtitle">BUILD · SURVIVE · ASCEND</div></div><div class="day" id="dayLabel">YEAR I · DAY 1<br><b>THE LAST EMBER</b></div></div><div class="resources">
<div class="res"><span class="ico">🪵</span><b id="wood">90</b><small>WOOD</small></div><div class="res"><span class="ico">🪨</span><b id="stone">65</b><small>STONE</small></div><div class="res"><span class="ico">🌾</span><b id="food">75</b><small>FOOD</small></div><div class="res"><span class="ico">⚙️</span><b id="iron">15</b><small>IRON</small></div><div class="res"><span class="ico">🪙</span><b id="gold">35</b><small>GOLD</small></div>
</div></header>
<main class="main" id="main"><canvas id="game"></canvas><div class="mapfade"></div><div class="maptop"><div class="pill" id="seasonPill">🍂 Ashen Spring <b>· Peace</b></div><div class="mapactions"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">＋</button><button id="pauseBtn">Ⅱ</button></div></div><div class="quest"><strong id="questTitle">FIRST LIGHT</strong><span id="questText">Place a lumber camp and secure a steady supply of wood.</span></div><div class="toast" id="toast"></div></main>

</div><div class="tray" id="tray"></div><div class="info" id="hint">Choose a structure, then tap an empty tile to place it.</div></footer>

</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),main=document.getElementById('main');
const $=id=>document.getElementById(id);
const RES=['wood','stone','food','iron','gold'];
const defs={
keep:{name:'Keep',icon:'🏰',cost:{wood:0,stone:0},desc:'The heart of your realm.',w:2,h:2,kind:'civic',hp:500},
house:{name:'Cottage',icon:'🏠',cost:{wood:18,stone:5},desc:'+4 population capacity.',w:1,h:1,kind:'civic',hp:90},
lumber:{name:'Lumber Camp',icon:'🪓',cost:{wood:24,stone:4},desc:'Produces 7 wood each day.',w:1,h:1,kind:'gather',prod:{wood:7},hp:80},
quarry:{name:'Stone Quarry',icon:'⛏️',cost:{wood:18,stone:12},desc:'Produces 4 stone each day.',w:1,h:1,kind:'gather',prod:{stone:4},hp:90},
farm:{name:'Grain Farm',icon:'🌾',cost:{wood:20,stone:3},desc:'Produces 8 food each day.',w:1,h:1,kind:'gather',prod:{food:8},hp:75},
ironmine:{name:'Iron Mine',icon:'⚒️',cost:{wood:25,stone:20},desc:'Produces 3 iron each day.',w:1,h:1,kind:'gather',prod:{iron:3},hp:100},
market:{name:'Market',icon:'🏪',cost:{wood:30,stone:12},desc:'Trade goods for gold and supplies.',w:1,h:1,kind:'civic',hp:100},
barracks:{name:'Barracks',icon:'⚔️',cost:{wood:35,stone:22},desc:'Train soldiers for the garrison.',w:1,h:1,kind:'military',hp:160},
tower:{name:'Watchtower',icon:'🗼',cost:{wood:25,stone:30},desc:'Raises defense against raids.',w:1,h:1,kind:'military',hp:190},
wall:{name:'Stone Wall',icon:'🧱',cost:{wood:5,stone:12},desc:'A tough barrier against raiders.',w:1,h:1,kind:'military',hp:260},
library:{name:'Scribe Hall',icon:'📚',cost:{wood:28,stone:18,gold:8},desc:'Unlocks research and wisdom.',w:1,h:1,kind:'civic',hp:100},
shrine:{name:'Ember Shrine',icon:'🕯️',cost:{stone:24,gold:12},desc:'Raises morale and prosperity.',w:1,h:1,kind:'civic',hp:110},
workshop:{name:'Workshop',icon:'🔨',cost:{wood:32,stone:20,iron:5},desc:'Improves industry and tools.',w:1,h:1,kind:'industry',hp:120},
};
const W=17,H=17;let grid=[],buildings=[],units=[],particles=[],state={wood:90,stone:65,food:75,iron:15,gold:35,pop:8,capacity:12,day:1,season:0,year:1,selected:null,tab:'build',paused:false,zoom:1,camX:0,camY:0,coins:0,army:3,morale:70,threat:0,raids:0,tech:{agri:0,industry:0,fortify:0,trade:0},research:null,progress:0,won:false,gameover:false,log:[],quests:0,autosave:true};
const seasons=['Ashen Spring','Sunfall','Red Harvest','Long Frost'];
function initGrid(){grid=[];for(let y=0;y<H;y++){grid[y]=[];for(let x=0;x<W;x++){let n=Math.sin(x*1.7+y*.8)+Math.cos(y*1.3-x*.65);grid[y][x]={type:(n>1.25?'rock':n<-.95?'grove':'grass'),x,y,occupied:null,detail:Math.abs(Math.sin(x*12.2+y*4.3))};}}}
function addBuilding(type,x,y,free=false){let d=defs[type];if(!d||!inside(x,y)||!canPlace(type,x,y))return false;if(!free&&!pay(d.cost))return false;const b={id:Date.now()+Math.random(),type,x,y,level:1,hp:d.hp,progress:0};buildings.push(b);for(let yy=y;yy<y+d.h;yy++)for(let xx=x;xx<x+d.w;xx++)if(inside(xx,yy))grid[yy][xx].occupied=b.id;if(type==='house')state.capacity+=4;if(type==='barracks')state.army+=2;burst(...iso(x+.5,y+.5),type==='keep'?'#e9c46a':'#9dbb9b',12);updateHUD();return true}
function inside(x,y){return x>=0&&y>=0&&x<W&&y<H}
function canPlace(type,x,y){let d=defs[type];if(!inside(x,y)||x+d.w>W||y+d.h>H)return false;for(let yy=y;yy<y+d.h;yy++)for(let xx=x;xx<x+d.w;xx++){if(!inside(xx,yy)||grid[yy][xx].occupied)return false;let t=grid[yy][xx].type;if(['keep','house','market','shrine'].includes(type)&&t==='rock')return false;}return true}
function pay(cost){for(let r in cost)if(state[r]<cost[r]){toast('Not enough '+r+' — gather more resources.');return false}for(let r in cost)state[r]-=cost[r];updateHUD();return true}
function insideCost(cost){return Object.entries(cost||{}).map(([r,n])=>({wood:'🪵',stone:'🪨',food:'🌾',iron:'⚙️',gold:'🪙'}[r]+n)).join(' · ')||'Free'}
function iso(x,y){let tw=48*state.zoom,th=24*state.zoom;return {x:canvas.width/2+(x-y)*tw*.5+state.camX*state.zoom,y:canvas.height*.49+(x+y)*th*.5+state.camY*state.zoom}}
function uniso(px,py){let tw=48*state.zoom,th=24*state.zoom;let a=(px-canvas.width/2-state.camX*state.zoom)/(tw*.5),b=(py-canvas.height*.49-state.camY*state.zoom)/(th*.5);return {x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function resize(){let r=main.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);canvas._dpr=dpr;canvas._w=r.width;canvas._h=r.height;draw()}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function diamond(x,y,fill,stroke){let p=iso(x,y),tw=24*state.zoom,th=12*state.zoom;poly([[p.x,p.y],[p.x+tw,p.y+th],[p.x,p.y+th*2],[p.x-tw,p.y+th]],fill,stroke)}
function drawTree(x,y,p){let z=state.zoom;ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(p.x,p.y+5*z,10*z,4*z,0,0,Math.PI*2);ctx.fill();poly([[p.x,p.y-17*z],[p.x-7*z,p.y-4*z],[p.x+7*z,p.y-4*z]],'#456d4e');poly([[p.x,p.y-25*z],[p.x-8*z,p.y-10*z],[p.x+8*z,p.y-10*z]],'#66875a');ctx.fillStyle='#795c42';ctx.fillRect(p.x-1.4*z,p.y-5*z,2.8*z,9*z)}
function drawRock(x,y,p){let z=state.zoom;poly([[p.x-8*z,p.y],[p.x-5*z,p.y-8*z],[p.x+2*z,p.y-11*z],[p.x+9*z,p.y-5*z],[p.x+8*z,p.y+2*z],[p.x,p.y+5*z]],'#6f7b78','#8e9a8e');poly([[p.x-5*z,p.y-8*z],[p.x+2*z,p.y-11*z],[p.x+1*z,p.y-3*z],[p.x-7*z,p.y-2*z]],'#9ba59a')}
function drawBuilding(b){let p=iso(b.x+.5,b.y+.5),z=state.zoom,tw=24*z,th=12*z;let d=defs[b.type];ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y+4*z,17*z,7*z,0,0,Math.PI*2);ctx.fill();
if(b.type==='wall'){poly([[p.x-14*z,p.y-4*z],[p.x,p.y+3*z],[p.x+14*z,p.y-4*z],[p.x,p.y-11*z]],'#777f78','#b4b8a1');poly([[p.x-14*z,p.y-4*z],[p.x,p.y+3*z],[p.x,p.y-5*z],[p.x-14*z,p.y-12*z]],'#58645e');poly([[p.x,p.y+3*z],[p.x+14*z,p.y-4*z],[p.x+14*z,p.y-12*z],[p.x,p.y-5*z]],'#9aa18f');return}
let col={keep:'#a78a5c',house:'#987557',lumber:'#77583d',quarry:'#737c78',farm:'#7c9a50',ironmine:'#65767a',market:'#b28c54',barracks:'#9a5f50',tower:'#8e9c96',library:'#7d8d9d',shrine:'#c1a86d',workshop:'#94785a'}[b.type]||'#9a8b6d';
let height=(b.type==='keep'?35:b.type==='tower'?31:b.type==='shrine'?24:b.type==='house'?16:19)*z;
poly([[p.x-tw*.65,p.y],[p.x,p.y+th*.52],[p.x,p.y-height+th*.52],[p.x-tw*.65,p.y-height]],'#465750');
poly([[p.x,p.y+th*.52],[p.x+tw*.65,p.y],[p.x+tw*.65,p.y-height],[p.x,p.y-height+th*.52]],col);
poly([[p.x-tw*.65,p.y-height],[p.x,p.y-height-th*.55],[p.x+tw*.65,p.y-height],[p.x,p.y-height+th*.02]],'#d5c49b','#77684d');
if(b.type==='keep'||b.type==='tower'){poly([[p.x-tw*.65,p.y-height],[p.x,p.y-height-th*.55],[p.x,p.y-height-th*1.3],[p.x-tw*.65,p.y-height-th*.75]],'#8c573f');poly([[p.x,p.y-height-th*.55],[p.x+tw*.65,p.y-height],[p.x+tw*.65,p.y-height-th*.75],[p.x,p.y-height-th*1.3]],'#ad7650');ctx.fillStyle='#f3c66f';ctx.fillRect(p.x-2*z,p.y-height+3*z,4*z,7*z)}
else if(b.type==='farm'){for(let i=-1;i<=1;i++){ctx.strokeStyle='#d6c38a';ctx.lineWidth=1.5*z;ctx.beginPath();ctx.moveTo(p.x-10*z,p.y+i*4*z);ctx.lineTo(p.x+10*z,p.y+(i-1)*4*z);ctx.stroke()}}
else if(b.type==='house'){poly([[p.x-9*z,p.y-height+4*z],[p.x,p.y-height-7*z],[p.x+9*z,p.y-height+4*z]],'#b7684c');ctx.fillStyle='#f4d58d';ctx.fillRect(p.x-3*z,p.y-height+5*z,5*z,6*z)}
else if(b.type==='shrine'){ctx.strokeStyle='#f4d88b';ctx.lineWidth=2*z;ctx.beginPath();ctx.arc(p.x,p.y-height-3*z,5*z,0,Math.PI*2);ctx.stroke()}
else if(b.type==='lumber'){ctx.fillStyle='#d1ae72';ctx.fillRect(p.x-7*z,p.y-height+4*z,14*z,4*z);ctx.fillRect(p.x-7*z,p.y-height+10*z,14*z,4*z)}
else {ctx.fillStyle='#3a4c49';ctx.fillRect(p.x-3*z,p.y-height+4*z,6*z,7*z);ctx.fillStyle='#e5c16d';ctx.fillRect(p.x-1*z,p.y-height+5*z,2*z,3*z)}
if(b.level>1){ctx.fillStyle='#f4d171';ctx.font='bold '+(9*z)+'px sans-serif';ctx.textAlign='center';ctx.fillText('★'+b.level,p.x,p.y-height-11*z)}
if(selectedBuilding===b.id){ctx.strokeStyle='#f4d171';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y+1*z,20*z,9*z,0,0,Math.PI*2);ctx.stroke()}
}
let selectedBuilding=null,hover=null;
function draw(){if(!ctx||!canvas._w)return;let w=canvas._w,h=canvas._h;ctx.clearRect(0,0,w,h);let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#243e3b');bg.addColorStop(.55,'#375345');bg.addColorStop(1,'#182e2d');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
for(let s=0;s<4;s++){ctx.fillStyle='#b6c5a8'+['10','09','08','07'][s];ctx.beginPath();ctx.ellipse(w*(s%2?.85:.1),h*(s<2?.16:.82),w*.28,h*.16,-.25,0,Math.PI*2);ctx.fill()}
for(let sum=0;sum<W+H;sum++){for(let x=Math.max(0,sum-H+1);x<Math.min(W,sum+1);x++){let y=sum-x;if(!inside(x,y))continue;let t=grid[y][x],p=iso(x,y);let c=t.type==='rock'?'#68746a':t.type==='grove'?'#355945':(t.detail>.72?'#50754e':t.detail<.15?'#426849':'#476f4c');diamond(x,y,c,'#7b946b55');if(t.type==='grove'&&!t.occupied&&state.zoom>.72&&((x*7+y*11)%4===0))drawTree(x,y,iso(x+.48,y+.48));if(t.type==='rock'&&!t.occupied&&state.zoom>.75&&((x*3+y*5)%3===0))drawRock(x,y,iso(x+.5,y+.5));if(hover&&hover.x===x&&hover.y===y){diamond(x,y,state.selected?(canPlace(state.selected,x,y)?'#f5dc7b55':'#e77e7055'):'#f5e9a322','#f2d67d')}}
}
buildings.sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(const b of buildings)drawBuilding(b);
for(const u of units){let p=iso(u.x+.5,u.y+.5),z=state.zoom;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y,5*z,2*z,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.enemy?'#e87565':'#d5d8c0';ctx.beginPath();ctx.arc(p.x,p.y-8*z,3.5*z,0,Math.PI*2);ctx.fill();ctx.strokeStyle=u.enemy?'#9d3c35':'#435a65';ctx.lineWidth=3*z;ctx.beginPath();ctx.moveTo(p.x,p.y-5*z);ctx.lineTo(p.x,p.y+1*z);ctx.stroke()}
for(const a of particles){ctx.globalAlpha=Math.max(0,a.life);ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(a.x,a.y,a.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x:x+(Math.random()-.5)*24,y:y+(Math.random()-.5)*12,dx:(Math.random()-.5)*1.8,dy:-Math.random()*1.8,life:1,color,size:1+Math.random()*2.5})}
function updateHUD(){for(let r of RES)$(r).textContent=Math.floor(state[r]);$('dayLabel').innerHTML='YEAR '+toRoman(state.year)+' · DAY '+state.day+'<br><b>'+(state.gameover?'REALM FALLEN':state.won?'CROWN RESTORED':'THE LAST EMBER')+'</b>';$('seasonPill').innerHTML=['🌱 Ashen Spring','☀️ Sunfall','🍂 Red Harvest','❄️ Long Frost'][state.season]+' <b>· '+(state.threat>0?'Threat '+state.threat:'Peace')+'</b>';$('questTitle').textContent=state.quests>=5?'THE CROWN RESTORED':'CHRONICLE '+String(state.quests+1).padStart(2,'0');let q=[['Place a Lumber Camp','Build a Lumber Camp to begin producing wood.'],['Feed the settlement','Build a Grain Farm before the next winter.'],['Raise the guard','Build a Barracks to recruit defenders.'],['Stone and shelter','Build two Cottages and a Quarry.'],['Knowledge is power','Build a Scribe Hall to unlock research.']][Math.min(state.quests,4)];$('questText').textContent=state.quests>=5?'Your realm has survived the first great trial. Expand, research and prepare for the final siege.':q[0]+': '+q[1];}
function toRoman(n){return ['I','II','III','IV','V','VI'][Math.min(5,Math.max(0,n-1))]||n}
const catalog={build:['house','lumber','quarry','farm','ironmine','market','workshop','library','shrine'],army:['barracks','tower','wall'],research:[],realm:[],council:[]};
function renderTray(){let tray=$('tray');tray.innerHTML='';if(state.tab==='research'){tray.innerHTML='<button class="buildcard" data-action="research"><span class="bi">🔬</span><b>Research Tree</b><small>Choose a specialization</small></button>';return}if(state.tab==='realm'){tray.innerHTML='<button class="buildcard" data-action="explore"><span class="bi">🧭</span><b>Explore</b><small>Scout nearby ruins</small></button><button class="buildcard" data-action="trade"><span class="bi">⚖️</span><b>Trade</b><small>Exchange resources</small></button>';return}if(state.tab==='council'){tray.innerHTML='<button class="buildcard" data-action="council"><span class="bi">👑</span><b>Royal Council</b><small>Realm status & laws</small></button><button class="buildcard" data-action="save"><span class="bi">💾</span><b>Save Realm</b><small>Keep your progress</small></button><button class="buildcard" data-action="reset"><span class="bi">↻</span><b>New Realm</b><small>Start over</small></button>';return}
for(let id of catalog[state.tab]||[]){let d=defs[id],cost=insideCost(d.cost);let b=document.createElement('button');b.className='buildcard'+(state.selected===id?' selected':'');b.innerHTML='<span class="bi">'+d.icon+'</span><b>'+d.name+'</b><small>'+d.desc+'</small><small class="cost">'+cost+'</small>';b.onclick=()=>{state.selected=state.selected===id?null:id;selectedBuilding=null;renderTray();$('hint').textContent=state.selected?'Tap a clear tile to place '+d.name+'.':'Choose a structure, then tap an empty tile to place it.';draw()};tray.appendChild(b)}
}
function toast(s){let el=$('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2400)}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalwrap').style.display='flex'}
function closeModal(){$('modalwrap').style.display='none'}
function action(a){if(a==='research')showResearch();if(a==='council')showCouncil();if(a==='trade')showTrade();if(a==='explore')explore();if(a==='save'){saveGame();toast('Realm saved on this device.')}if(a==='reset')openModal('Begin a New Realm','<p>This will erase your current local save and begin again.</p><div class="modalactions"><button class="danger" id="confirmReset">Erase & restart</button><button id="cancelReset">Keep my realm</button></div>')}
function showResearch(){let ts=[['agri','Crop Rotation','Farms produce 35% more food.','🌾',25],['industry','Master Craftsmen','All resource buildings produce 25% more.','⚒️',35],['fortify','Ironbound Walls','Reduce raid damage and strengthen towers.','🛡️',30],['trade','Guild Charters','Markets yield 50% more gold.','🪙',30]];openModal('Research & Discovery','<p>Invest gold and wisdom to permanently change how your kingdom works. Each discipline can be advanced twice.</p><div class="modalgrid">'+ts.map(t=>'<button class="tech" data-tech="'+t[0]+'"><b>'+t[3]+' '+t[1]+' · '+(state.tech[t[0]]||0)+'/2</b><small>'+t[2]+'</small><em>Cost: '+(t[4]*(1+(state.tech[t[0]]||0)))+' gold</em></button>').join('')+'</div><p id="modalNote">Build a Scribe Hall to pursue advanced knowledge.</p>');}
function showCouncil(){openModal('Royal Council','<p>The kingdom is only as strong as its stores, people and defenses.</p><div class="statline"><b>Population</b><span>'+state.pop+' / '+state.capacity+'</span></div><div class="statline"><b>Garrison</b><span>'+state.army+' soldiers</span></div><div class="statline"><b>Morale</b><span>'+state.morale+' / 100</span></div><div class="statline"><b>Buildings</b><span>'+buildings.length+'</span></div><div class="statline"><b>Raids survived</b><span>'+state.raids+'</span></div><div class="statline"><b>Days survived</b><span>'+state.day+'</span></div><p>Tip: Keep food above population demand, and build towers before the threat meter fills.</p><div class="modalactions"><button class="primary" id="decree">Issue Royal Decree · 12 Gold</button><button id="saveModal">Save Realm</button></div>')}
function showTrade(){openModal('Merchant Caravan','<p>Exchange surplus goods with passing caravans. Trade rates change with your market and research.</p><div class="modalgrid"><button class="tech" data-trade="wood"><b>🪵 Buy 25 Wood</b><small>For builders and industry</small><em>8 gold</em></button><button class="tech" data-trade="food"><b>🌾 Buy 30 Food</b><small>Prepare for winter</small><em>7 gold</em></button><button class="tech" data-trade="stone"><b>🪨 Buy 15 Stone</b><small>Strengthen the realm</small><em>8 gold</em></button><button class="tech" data-trade="sell"><b>📦 Sell Surplus</b><small>Trade 20 wood or stone</small><em>+6 gold</em></button></div>')}
function explore(){if(!pay({food:12,gold:5}))return;let rewards=[['wood',35],['stone',25],['iron',12],['gold',22]];let [r,n]=rewards[Math.floor(Math.random()*rewards.length)];state[r]+=n;state.morale=Math.min(100,state.morale+4);toast('Scouts returned: +'+n+' '+r+'.');burst(canvas._w*.7,canvas._h*.4,'#f0cf76',18);updateHUD();draw()}
function tick(){if(state.paused||state.gameover)return;state.progress++;if(state.progress%7!==0)return;state.day++;if(state.day>28){state.day=1;state.season=(state.season+1)%4;if(state.season===0)state.year++}
let production={wood:0,stone:0,food:0,iron:0,gold:0};for(let b of buildings){let d=defs[b.type];if(d.prod)for(let r in d.prod)production[r]+=d.prod[r]*(1+(b.level-1)*.25);if(b.type==='market')production.gold+=2;if(b.type==='shrine')state.morale=Math.min(100,state.morale+.2;ifFalse); }
}
function simulateDay(){if(state.paused||state.gameover)return;state.day++;if(state.day>28){state.day=1;state.season=(state.season+1)%4;if(state.season===0)state.year++}
let p={wood:0,stone:0,food:0,iron:0,gold:0};for(let b of buildings){let d=defs[b.type];if(d.prod)for(let r in d.prod)p[r]+=d.prod[r]*(1+(b.level-1)*.25)*(1+((b.type==='farm'&&state.tech.agri)||(d.kind==='gather'&&state.tech.industry)?(b.type==='farm'?state.tech.agri*.35:state.tech.industry*.25):0));if(b.type==='market')p.gold+=2*(1+state.tech.trade*.5);if(b.type==='shrine')state.morale=Math.min(100,state.morale+.8);if(b.type==='workshop')p.iron+=.5}
for(let r in p)state[r]=Math.max(0,Math.min(9999,state[r]+p[r]));
let demand=Math.max(2,Math.ceil(state.pop*.6));state.food-=demand;if(state.season===3)state.food-=Math.ceil(state.pop*.35);
if(state.food<0){state.food=0;state.morale=Math.max(0,state.morale-9);if(state.morale<20&&Math.random()<.22&&state.pop>4){state.pop--;toast('Famine! A family has left the settlement.')}}else state.morale=Math.min(100,state.morale+.5);
if(state.pop<state.capacity&&state.food>state.pop*2&&Math.random()<.35)state.pop++;
state.threat=Math.min(100,state.threat+3+(state.year-1)*.7);
if(state.threat>=100){raid();state.threat=0}
if(state.quests<5){let complete=false;if(state.quests===0&&count('lumber')>0)complete=true;if(state.quests===1&&count('farm')>0)complete=true;if(state.quests===2&&count('barracks')>0)complete=true;if(state.quests===3&&count('house')>=2&&count('quarry')>0)complete=true;if(state.quests===4&&count('library')>0)complete=true;if(complete){state.quests++;state.gold+=12;state.morale=Math.min(100,state.morale+8);toast('Chronicle completed! +12 gold, morale restored.')}}if(state.quests>=5&&state.raids>=3&&count('keep')>0)state.won=true;
updateHUD();renderTray();draw();saveGame()}
function count(type){return buildings.filter(b=>b.type===type).length}
function raid(){state.raids++;let defense=state.army*8+count('tower')*17+count('wall')*3+state.tech.fortify*12;let force=22+state.year*8+state.raids*4;burst(canvas._w*.55,canvas._h*.4,'#e56d5d',22);if(defense>=force){let loot=Math.min(state.gold,10+Math.floor(Math.random()*12));state.gold-=loot;state.morale=Math.min(100,state.morale+4);toast('Raid repelled! Your garrison seized '+(6+state.raids)+' iron.');state.iron+=6+state.raids}else{let loss=Math.min(state.wood,12+state.raids*3);state.wood-=loss;state.morale=Math.max(0,state.morale-12);let victim=buildings.filter(b=>b.type!=='keep').sort((a,b)=>a.hp-b.hp)[0];if(victim){victim.hp-=35;if(victim.hp<=0){buildings=buildings.filter(b=>b.id!==victim.id);for(let row of grid)for(let t of row)if(t.occupied===victim.id)t.occupied=null;toast('Raiders destroyed your '+defs[victim.type].name+'!')}else toast('Raiders breached the defenses! Lost '+loss+' wood.')}else toast('Raiders struck the Keep! Raise a garrison.')}if(state.morale<=0){state.gameover=true;toast('The realm has fallen. Open Council to begin again.')} }
let pointer=null,dragging=false,dragStart=null,lastTap=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};dragging=false;dragStart={x:e.clientX,y:e.clientY,camX:state.camX,camY:state.camY}});
canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};hover=uniso(p.x,p.y);if(pointer){let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(e.clientX-dragStart.x)+Math.abs(e.clientY-dragStart.y)>8){dragging=true;state.camX=dragStart.camX+(e.clientX-dragStart.x)/state.zoom;state.camY=dragStart.camY+(e.clientY-dragStart.y)/state.zoom;}}draw()});
canvas.addEventListener('pointerup',e=>{if(!pointer)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;let wasDrag=dragging;pointer=null;if(!wasDrag){let r=canvas.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top},tile=uniso(p.x,p.y);if(state.selected){if(addBuilding(state.selected,tile.x,tile.y)){state.selected=null;renderTray();$('hint').textContent='Structure placed. Keep expanding wisely.';advanceQuestCheck()}else toast('Cannot build there — choose a clear tile and check your resources.')}else{let b=buildings.find(b=>tile.x>=b.x&&tile.y>=b.y&&tile.x<b.x+defs[b.type].w&&tile.y<b.y+defs[b.type].h);if(b){selectedBuilding=b.id;showBuilding(b)}else selectedBuilding=null}draw()}});
function showBuilding(b){let d=defs[b.type];openModal(d.icon+' '+d.name,'<p>'+d.desc+'</p><div class="statline"><b>Condition</b><span>'+Math.max(0,b.hp)+' / '+d.hp+' HP</span></div><div class="statline"><b>Level</b><span>'+b.level+'</span></div>'+(d.prod?'<div class="statline"><b>Daily production</b><span>'+Object.entries(d.prod).map(([r,n])=>n+' '+r).join(', ')+'</span></div>':'')+'<div class="modalactions"><button class="primary" id="upgradeBuilding">Upgrade · '+(10*b.level)+' wood + '+(8*b.level)+' stone</button><button id="repairBuilding">Repair · 8 wood</button><button class="danger" id="demolishBuilding">Demolish (refund 30%)</button></div>');$('upgradeBuilding').onclick=()=>{if(pay({wood:10*b.level,stone:8*b.level})){b.level++;b.hp=d.hp;toast(d.name+' upgraded to level '+b.level);closeModal();updateHUD();draw();renderTray()}};$('repairBuilding').onclick=()=>{if(pay({wood:8})){b.hp=d.hp;toast('Structure repaired.');closeModal();draw()}};$('demolishBuilding').onclick=()=>{if(b.type==='keep'){toast('The Keep cannot be demolished.');return}buildings=buildings.filter(v=>v.id!==b.id);for(let row of grid)for(let t of row)if(t.occupied===b.id)t.occupied=null;state.wood+=Math.floor((d.cost.wood||0)*.3);state.stone+=Math.floor((d.cost.stone||0)*.3);if(b.type==='house')state.capacity-=4;if(b.type==='barracks')state.army=Math.max(0,state.army-2);closeModal();updateHUD();draw();toast('Structure demolished.');}}
function advanceQuestCheck(){simulateQuestOnly()}
function simulateQuestOnly(){if(state.quests===0&&count('lumber'))state.quests=1;else if(state.quests===1&&count('farm'))state.quests=2;else if(state.quests===2&&count('barracks'))state.quests=3;else if(state.quests===3&&count('house')>=2&&count('quarry'))state.quests=4;else if(state.quests===4&&count('library'))state.quests=5;updateHUD()}
function saveGame(){try{localStorage.setItem('empireOfAshSave',JSON.stringify({state,buildings,grid:grid.map(row=>row.map(t=>({type:t.type,x:t.x,y:t.y,detail:t.detail}))) }))}catch(e){}}
function loadGame(){try{let raw=localStorage.getItem('empireOfAshSave');if(!raw)return false;let s=JSON.parse(raw);Object.assign(state,s.state);buildings=s.buildings||[];if(s.grid&&s.grid.length===H){grid=s.grid.map(row=>row.map(t=>({...t,occupied:null})));for(let b of buildings){let d=defs[b.type];for(let y=b.y;y<b.y+d.h;y++)for(let x=b.x;x<b.x+d.w;x++)if(inside(x,y))grid[y][x].occupied=b.id}}return true}catch(e){return false}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.selected=null;document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('active',t===b));renderTray();$('hint').textContent=state.tab==='build'?'Choose a structure, then tap an empty tile to place it.':state.tab==='army'?'Raise defenses and build a garrison before the threat reaches 100.':state.tab==='research'?'Invest in technologies to specialize your kingdom.':state.tab==='realm'?'Explore ruins and trade surplus goods.':'Review your realm and issue royal decrees.';});
$('tray').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});
$('modalClose').onclick=closeModal;$('modalwrap').addEventListener('click',e=>{if(e.target===$('modalwrap'))closeModal()});
$('modalBody').addEventListener('click',e=>{let t=e.target.closest('[data-tech]');if(t){let k=t.dataset.tech,cost=({agri:25,industry:35,fortify:30,trade:30}[k])*(1+state.tech[k]);if(!count('library')){$('modalNote').textContent='Build a Scribe Hall first.';return}if(state.tech[k]>=2){$('modalNote').textContent='This discipline is fully researched.';return}if(pay({gold:cost})){state.tech[k]++;toast('Research complete: '+t.querySelector('b').textContent);showResearch();saveGame()}}let tr=e.target.closest('[data-trade]');if(tr){let k=tr.dataset.trade;if(k==='sell'){let r=state.wood>=20?'wood':state.stone>=20?'stone':null;if(!r){toast('Need 20 wood or stone to sell.');return}state[r]-=20;state.gold+=6}else{let price=k==='wood'?8:k==='food'?7:8;if(!pay({gold:price}))return;state[k]+=k==='wood'?25:k==='food'?30:15}updateHUD();showTrade();saveGame()}if(e.target.id==='decree'){if(pay({gold:12})){state.morale=Math.min(100,state.morale+25);state.pop=Math.min(state.capacity,state.pop+1);toast('The people rally behind the Crown.');showCouncil()}}if(e.target.id==='saveModal'){saveGame();toast('Realm saved.');closeModal()}if(e.target.id==='confirmReset'){localStorage.removeItem('empireOfAshSave');location.reload()}if(e.target.id==='cancelReset')closeModal()});
$('zoomIn').onclick=()=>{state.zoom=Math.min(1.55,state.zoom+.12);draw()};$('zoomOut').onclick=()=>{state.zoom=Math.max(.55,state.zoom-.12);draw()};$('pauseBtn').onclick=()=>{state.paused=!state.paused;$('pauseBtn').textContent=state.paused?'▶':'Ⅱ';toast(state.paused?'Realm paused.':'Time resumed.')};
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame()});
initGrid();let loaded=loadGame();if(!loaded){addBuilding('keep',8,7,true);addBuilding('house',10,8,true);addBuilding('house',6,8,true);units=[{x:8,y:9,enemy:false},{x:9,y:8,enemy:false},{x:7,y:9,enemy:false}];}
renderTray();updateHUD();resize();setInterval(simulateDay,2600);setInterval(()=>{if(particles.length){for(let p of particles){p.x+=p.dx;p.y+=p.dy;p.life-=.045}particles=particles.filter(p=>p.life>0);draw()}},40);
})();
</script></body></html>
